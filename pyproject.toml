[project]
name = "apex"
version = "0.1.2.dev0"
description = "Agentic Platform for Ensemble eXploration: agent-driven ensemble history matching and optimization."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = [
    "LICENSE.txt",
    "LICENSES/Apache-2.0-pymoo.txt",
    "THIRD_PARTY_NOTICES.md",
]
dependencies = [
    "numpy>=2.0",
    "pydantic>=2.9",
    "pywavelets>=1.8",
    "rich>=13.7",
    "scipy>=1.14",
    "tomli-w>=1.0",
    "typer>=0.12",
]

[project.scripts]
apex = "apex.cli.main:cli"

[project.entry-points.ert]
apex = "apex.integrations.ert.plugin"

[project.entry-points."apex.update_strategies"]
ert_esmda = "apex.integrations.ert.smoothers:ErtEsmda"
ert_adaptive = "apex.integrations.ert.smoothers:ErtAdaptive"
ert_localized = "apex.integrations.ert.smoothers:ErtLocalized"

[project.entry-points."ropt.plugins.backend"]
apex = "apex.integrations.everest.backend:ApexBackendPlugin"

[project.entry-points."apex.optimizers"]
ropt = "apex.integrations.everest.optimizer:RoptOptimizer"

[project.entry-points."apex.converter_skills"]
ert = "apex.integrations.ert.converter_skill:ErtSkill"

[project.entry-points."apex.engines"]
ert = "apex.integrations.ert.engine:ErtEngine"

[project.optional-dependencies]
reservoir = [
    "mako>=1.4.3",
    "resdata>=6.3.5",
]
plots = [
    "matplotlib>=3.9",
]
geostatspy = [
    "geostatspy>=0.0.79",
    "matplotlib>=3.11.2",
    "numba>=0.67.0",
    "pandas>=3.0.6",
    "statsmodels>=0.15.0",
    "tqdm>=4.70.1",
]
mcp = [
    "mcp>=1.12",
]
api = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
]
llm = [
    "anthropic>=0.40",
    "httpx>=0.27",
]
facies = [
    "gstools>=1.7",
    "scikit-mps>=0.6,<0.7",
]
ecalc = [
    "libecalc>=15,<16",
]
torch = [
    "torch>=2.5",
]
ert = [
    "ert>=26.0.1,<27",
    "iterative-ensemble-smoother>=1.3,<1.4",
]
co2 = [
    "CoolProp==8.0.0",
]

[tool.uv]
default-groups = [
    "dev",
    "docs",
]
index = [
    { name = "pytorch-cpu", url = "https://download.pytorch.org/whl/cpu", explicit = true },
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [
    "src",
    "tests",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "C4",
    "SIM",
    "RUF",
    "NPY",
    "PT",
    "D",
    "ANN",
    "BLE",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D",
]
"packages/*/tests_*/**" = [
    "D",
]
"docs/**/*.ipynb" = [
    "D",
    "ANN",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "src",
    "tests",
    "tools/docs",
]
mypy_path = [
    "src",
    "tests",
]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "mako.*",
    "playwright",
    "playwright.*",
    "resdata.*",
    "geostatspy.*",
    "pandas.*",
    "pywt.*",
    "gstools.*",
    "ert.*",
    "resfo.*",
    "polars.*",
    "surfio.*",
    "iterative_ensemble_smoother.*",
    "ropt.*",
    "libecalc.*",
    "ecalc_cli.*",
    "CoolProp",
    "CoolProp.*",
    "h5py",
    "h5py.*",
    "pygments.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "apex.integrations.ert.plugin",
    "apex.integrations.everest.backend",
]
disallow_subclassing_any = false
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "-m",
    "not integration",
]
pythonpath = [
    ".",
]
markers = [
    "integration: runs a real reservoir simulator or external executor",
    "pet_parity: compares an APEX method against stored PET reference outputs",
]

[tool.importlinter]
root_packages = [
    "apex",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture (inner layers never import outer ones)"
type = "layers"
layers = [
    "apex.api | apex.cli | apex.client | apex.testing",
    "apex.integrations",
    "apex.agents",
    "apex.services",
    "apex.workflows",
    "apex.algorithms | apex.simulation | apex.execution | apex.storage | apex.reporting",
    "apex.core",
    "apex.domain",
]

[[tool.importlinter.contracts]]
name = "ERT only in apex.integrations"
type = "forbidden"
source_modules = [
    "apex.domain",
    "apex.core",
    "apex.algorithms",
    "apex.simulation",
    "apex.execution",
    "apex.storage",
    "apex.reporting",
    "apex.workflows",
    "apex.services",
    "apex.agents",
    "apex.api",
    "apex.cli",
    "apex.client",
]
forbidden_modules = [
    "ert",
    "everest",
    "ropt",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "APEX never imports PET"
type = "forbidden"
source_modules = [
    "apex",
]
forbidden_modules = [
    "pipt",
    "popt",
    "ensemble",
    "simulator",
    "input_output",
]

[build-system]
requires = [
    "hatchling>=1.27",
]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "apex[api,ecalc,facies,geostatspy,llm,mcp,plots,reservoir]",
    "import-linter>=2.1",
    "ipykernel>=7.4.0",
    "mypy>=1.13",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-benchmark>=5.0",
    "pytest-xdist>=3.6",
    "ruff>=0.8",
    "scikit-image>=0.24",
    "scipy-stubs>=1.18.1.1",
]
docs = [
    "mkdocs-jupyter>=0.26.3",
    "mkdocs-material>=9.5",
]
