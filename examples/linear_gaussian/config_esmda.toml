# Linear-Gaussian example: ES-MDA (4 steps), whose posterior should match the exact one.
[run]
name = "linear_esmda"
seed = 2026

[[state.variables]]
name = "x"
size = 3

[prior]
ensemble_size = 500
generator = { name = "gaussian", options = { mean = 0.0, std = 1.0 } }

[observations]
file = "observations.csv"

[case]  # synthetic: the true model generated the data (RMSE is scored against it)
kind = "synthetic"
truth_file = "truth.npz"

[simulator]
name = "linear"

[simulator.options]
forward_file = "forward.npz"
variables = ["x"]
outputs = [["t0", "y"], ["t1", "y"], ["t2", "y"], ["t3", "y"], ["t4", "y"], ["t5", "y"], ["t6", "y"], ["t7", "y"]]

[execution]
name = "process"
options = { workers = 4 }

[method]
name = "esmda"
options = { inflation = [4, 4, 4, 4] }
strategy = { name = "approx", options = { energy = 1.0 } }

# Optional diagnostics: nothing is saved unless requested. Uncomment to save
# the ES-MDA step and the approx strategy's gain-like matrix (acting on whitened data;
# n_state x n_data: small here, possibly huge in field cases) in
# checkpoints/diagnostics_<k>.npz; read them back with RunResults.diagnostics(k).
# [output]
# diagnostics = ["step", "gain"]      # bare names: every plugin that produces them
# diagnostics_max_mb = 200            # items larger than this (per step) are skipped
# diagnostics_every = 1               # save every k-th iteration
#
# A plugin's OWN diagnostics table OVERRIDES [output] for that plugin, both ways
# (true saves an item [output] does not list, false suppresses one it does); its max_mb
# and every override the run-wide limits. The run logs the resulting plan, warns about
# each contradiction and writes checkpoints/diagnostics_plan.json. For example:
# strategy = { name = "approx", options = { energy = 1.0 }, diagnostics = { gain = false, singular_values = true } }
