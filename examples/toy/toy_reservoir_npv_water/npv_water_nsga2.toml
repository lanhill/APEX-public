# NPV against the water injected on the toy reservoir: one simulation per member
# gives both objectives; the front trades NPV for water. Seconds, no reservoir simulator.
# Run: apex optimize npv_water_nsga2.toml, then apex report runs/npv_water_nsga2 --plots

[optimization]
name = "npv_water_nsga2"
seed = 5

[[controls.variables]]
name = "inj"
initial = [100.0, 100.0]
lower = 1.0
upper = 400.0

[[objectives]]
name = "npv"
label = "npv"
options = { start = "2000-01-01", times = ["2001-01-01", "2002-01-01", "2003-01-01"], wop = 1.0, wwi = 0.02, disc = 0.08, obj_scaling = -1000.0 }

[[objectives]]
name = "field_total"
label = "water_injected"
options = { vector = "FWIT", time = "2003-01-01", scale = 0.001 }

[optimizer]
name = "nsga2"
options = { pop_size = 20, maxiter = 30, transform = true }

[simulator]
name = "toy_reservoir"

[execution]
name = "serial"
