# SCH: the simplest two-objective problem. Source: Schaffer (1985), in the form of Deb's 2001 book; not in pymoo 0.6.2, written from the paper.
# Run: apex optimize sch_nsga2.toml, then apex report runs/sch_nsga2 --plots

[optimization]
name = "sch_nsga2"
seed = 1

[[controls.variables]]
name = "x"
initial = [0.0]
lower = -1000.0
upper = 1000.0

[objective]
name = "sch"

[optimizer]
name = "nsga2"
options = { pop_size = 40, maxiter = 150, transform = true }
