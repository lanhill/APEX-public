# KUR: a disconnected front. Source: pymoo 0.6.2 (github.com/anyoptimization/pymoo, Apache-2.0; Blank & Deb 2020), problems/multi/kursawe.py; Kursawe (1991).
# Run: apex optimize kur_nsga2.toml, then apex report runs/kur_nsga2 --plots

[optimization]
name = "kur_nsga2"
seed = 1

[[controls.variables]]
name = "x"
initial = [0.0, 0.0, 0.0]
lower = -5.0
upper = 5.0

[objective]
name = "kur"

[optimizer]
name = "nsga2"
options = { pop_size = 40, maxiter = 150, transform = true }
