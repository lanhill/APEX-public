# DTLZ2: three objectives. Source: pymoo 0.6.2 (github.com/anyoptimization/pymoo, Apache-2.0; Blank & Deb 2020), problems/many/dtlz.py; Deb, Thiele, Laumanns & Zitzler (2002).
# Run: apex optimize dtlz2_nsga2.toml, then apex report runs/dtlz2_nsga2 --plots

[optimization]
name = "dtlz2_nsga2"
seed = 1

[[controls.variables]]
name = "x"
initial = [0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5]
lower = 0.0
upper = 1.0

[objective]
name = "dtlz2"

[optimizer]
name = "nsga2"
options = { pop_size = 60, maxiter = 150, transform = true }
