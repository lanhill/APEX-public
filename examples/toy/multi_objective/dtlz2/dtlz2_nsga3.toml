# DTLZ2 (3 objectives) by NSGA-III: 28 reference directions.
# Run: apex optimize dtlz2_nsga3.toml, then apex report runs/dtlz2_nsga3 --plots

[optimization]
name = "dtlz2_nsga3"
seed = 1

[[controls.variables]]
name = "x"
initial = [
    0.5,
    0.5,
    0.5,
    0.5,
    0.5,
    0.5,
    0.5,
    0.5,
    0.5,
    0.5,
    0.5,
    0.5,
]
lower = 0.0
upper = 1.0

[objective]
name = "dtlz2"

[optimizer]
name = "nsga3"

[optimizer.options]
maxiter = 150
transform = true
