# ZDT3: five disconnected pieces. Source: pymoo 0.6.2 (github.com/anyoptimization/pymoo, Apache-2.0; Blank & Deb 2020), problems/multi/zdt.py; Zitzler, Deb & Thiele (2000).
# Run: apex optimize zdt3_nsga2.toml, then apex report runs/zdt3_nsga2 --plots

[optimization]
name = "zdt3_nsga2"
seed = 1

[[controls.variables]]
name = "x"
initial = [0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5]
lower = 0.0
upper = 1.0

[objective]
name = "zdt3"

[optimizer]
name = "nsga2"
options = { pop_size = 40, maxiter = 150, transform = true }
