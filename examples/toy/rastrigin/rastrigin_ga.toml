# Rastrigin's function (2 variables, many local minima, global 0 at 0) with ga.
# Run: apex optimize rastrigin_ga.toml, then apex report runs/rastrigin_ga --plots

[optimization]
name = "rastrigin_ga"
seed = 1

[[controls.variables]]
name = "x"
initial = [3.0, -2.5]
lower = -5.12
upper = 5.12

[objective]
name = "rastrigin"

[optimizer]
name = "ga"
options = { maxiter = 200, transform = true }
