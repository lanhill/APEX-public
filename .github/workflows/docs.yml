# The documentation site on GitHub Pages (the user, 2026-11-06): built from this repository's
# docs/ with mkdocs.yml (the public pages only) on every push to main, and deployed by
# GitHub's own Pages actions. The repository's Settings > Pages must have "GitHub Actions" as
# its source. Every action is pinned to a commit, as in ci.yml.
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.24"
          enable-cache: true
      - name: Install
        # The docs tools only (mkdocs-material, mkdocs-jupyter): the build imports no APEX
        # module. A plugin that did (mkdocstrings) would need ci.yml's install here too.
        run: uv sync --locked --python 3.12 --no-default-groups --group docs
      - name: Build
        run: uv run --no-sync mkdocs build --strict --site-dir site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
