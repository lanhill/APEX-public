# The documentation on Read the Docs (the user, 2026-11-06): a version of the site per
# release. The same build as GitHub Pages: the locked environment (its default groups include
# the docs tools) and mkdocs.yml, the public pages only.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    create_environment:
      - asdf plugin add uv
      - asdf install uv 0.12.24
      - asdf global uv 0.12.24
    install:
      # The docs tools only, as the GitHub Pages workflow (.github/workflows/docs.yml).
      - UV_PROJECT_ENVIRONMENT=$READTHEDOCS_VIRTUALENV_PATH uv sync --locked --python 3.12 --no-default-groups --group docs

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true
