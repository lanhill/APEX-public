# The public documentation: the pages marked `audience: public` only, selected by
# tools/docs/public_only.py. Build: uv run mkdocs build --strict (with -f and this file's
# name when it is not mkdocs.yml).
site_name: APEX
site_description: Agentic Platform for Ensemble eXploration
site_dir: site-public
theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
plugins:
  - search
  # Notebooks are shown with the outputs they were executed with; the docs
  # build never runs them (the notebook test does).
  - mkdocs-jupyter:
      execute: false
      include: ["*.ipynb"]
      include_source: true
hooks:
  - tools/docs/public_only.py
nav:
  - Home: index.md
  - Getting started:
      - getting_started/web_ui.md
      - getting_started/agents_cli.md
      - getting_started/case_converter.md
